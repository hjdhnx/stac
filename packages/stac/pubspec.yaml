name: stac
description: Stac is a Server-Driven UI (SDUI) framework for Flutter. This fork renders with the official standalone material_ui package.
version: 1.6.0
publish_to: 'none'
repository: https://github.com/hjdhnx/stac
homepage: https://stac.dev/

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

topics:
  - ui
  - widget
  - server-driven-ui
  - dynamic-widgets

dependencies:
  flutter:
    sdk: flutter
  # Official standalone Material / Cupertino packages (split out of the SDK).
  material_ui: ^1.8.0
  cupertino_ui: ^1.1.4
  json_annotation: ^4.12.0
  flutter_validators: ^1.2.0
  dio: ^5.11.1
  stac_framework: ^1.0.0
  cached_network_image: ^4.0.0
  flutter_svg: ^2.3.0
  stac_logger: ^1.1.0
  # Monorepo-local: this fork adds lazyGrid to stac_core, so the published
  # ^1.6.0 constraint would silently drop it. Path deps inside a git
  # dependency resolve relative to this package.
  stac_core:
    path: ../stac_core
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
